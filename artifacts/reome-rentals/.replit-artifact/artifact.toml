kind = "web"
previewPath = "/"
title = "Reome Rentals"
description = "A browser-only rental discovery prototype inspired by the provided screenshot. Search and filter home listings, save favorites, and use a guided renter questionnaire that summarizes preferences at a 98% understanding threshold. Built with plain HTML, CSS, and JavaScript with simulated in-browser behavior."
version = "1.0.0"
id = "artifacts/reome-rentals"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20643

[services.development]
run = "pnpm --filter @workspace/reome-rentals run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reome-rentals", "run", "build" ]
serve = "static"
publicDir = "artifacts/reome-rentals/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20643"
BASE_PATH = "/"
